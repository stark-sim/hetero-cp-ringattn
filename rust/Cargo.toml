[package]
name = "hcp-ringattn-rust"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["tch-backend"]
tch-backend = ["dep:tch", "dep:half"]
# NIXL block-direct transport (form-B third transport), backed by the official
# nixl-sys crate. Off by default: nixl-sys's bindgen needs libclang, so this
# feature only compiles on white/pearl (clang + libclang installed), never on
# the Mac. stub-api makes the crate dlopen libnixl_capi.so at runtime instead
# of linking it at build time, so it works against either the pearl source
# build tree or the white conda wheel.
nixl-backend = ["dep:nixl-sys"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
tch = { version = "0.24.0", optional = true, default-features = false }
nixl-sys = { version = "1.4", optional = true, features = ["stub-api"] }
safetensors = "0.7"
tokenizers = "0.23"
half = { version = "2.7", optional = true }
bytemuck = "1.22"
libc = "0.2"
quinn = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rand = "0.8"

[[bin]]
name = "quic-echo-server"
path = "src/bin/quic_echo_server.rs"

[[bin]]
name = "nixl-probe"
path = "src/bin/nixl_probe.rs"
required-features = ["nixl-backend"]



[build-dependencies]
cc = "1.0"
